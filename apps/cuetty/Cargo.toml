[package]
name = "cuetty"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Cuetty is intentionally an app-local workspace, not a Cuenv root member.
[workspace]
resolver = "2"

[dependencies]
async-channel = "2.5.0"
cuengine = { path = "../../crates/cuengine" }
gpui = "0.2.2"
gpui-component = "0.5.1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Public Rust terminal core, pinned to the reviewed PTY lifecycle fix from
# https://github.com/raphamorim/rio/pull/1927.
rio-vt = { git = "https://github.com/rawkode/rio", rev = "b0694c0707a90dc93fdf01cbf8a658424be285ee" }

[dev-dependencies]
libc = "0.2.189"
