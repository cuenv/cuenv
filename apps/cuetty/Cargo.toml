[package]
name = "cuetty"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Cuetty is intentionally an app-local workspace, not a Cuenv root member.
[workspace]
resolver = "2"

[dependencies]
async-channel = "2.5.0"
cuengine = { path = "../../crates/cuengine" }
gpui = "0.2.2"
gpui-component = "0.5.1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Public Rust terminal core, pinned to the ADR-0010 qualification baseline.
rio-vt = { git = "https://github.com/raphamorim/rio", rev = "7ae087500bcde5c0c9f09cb9c50382e9220b3360" }

[dev-dependencies]
