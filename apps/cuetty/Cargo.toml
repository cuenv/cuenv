[package]
name = "cuetty"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Cuetty is intentionally an app-local workspace, not a Cuenv root member.
[workspace]
resolver = "2"
members = ["compat/stacksafe"]

[dependencies]
async-channel = "2.5.0"
cuengine = { path = "../../crates/cuengine" }
gpui = "0.2.2"
gpui-component = "0.5.1"
libc = "0.2.189"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Public Rust terminal core: the upstream PTY lifecycle fix plus one commit that keeps
# the OSC 133 marks around command output. Return to upstream once that is merged there.
rio-vt = { git = "https://github.com/rawkode/rio", rev = "200e78994355481c7e06cd840fbcaeb8a1e6b519" }

# GPUI 0.2 requires stacksafe 0.1, whose macro depends on an unmaintained crate.
# The adapter supplies the API GPUI uses through maintained stacksafe 1.x.
[patch.crates-io]
stacksafe = { path = "compat/stacksafe" }
