[package]
name = "cuetty"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Cuetty is intentionally an app-local workspace, not a Cuenv root member.
[workspace]
resolver = "2"
members = ["compat/stacksafe"]

[dependencies]
async-channel = "2.5.0"
cuengine = { path = "../../crates/cuengine" }
gpui = "0.2.2"
gpui-component = "0.5.1"
libc = "0.2.189"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Public Rust terminal core: the upstream PTY lifecycle fix plus one commit that keeps
# OSC 133 output marks and complete OSC 8 destinations. Return to upstream once
# equivalent command-output tracking is available there.
rio-vt = { git = "https://github.com/rawkode/rio", rev = "2d3da2dabe066a8b7aff590cd2d7bcbf79ec5778" }

[target.'cfg(target_os = "macos")'.dependencies]
# Compile shaders when GPUI starts so builds don't require Xcode's Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# GPUI 0.2 requires stacksafe 0.1, whose macro depends on an unmaintained crate.
# The adapter supplies the API GPUI uses through maintained stacksafe 1.x.
[patch.crates-io]
stacksafe = { path = "compat/stacksafe" }
