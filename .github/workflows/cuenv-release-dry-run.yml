# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: cuenv-release-dry-run
on:
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  cargo-build-darwin-arm64:
    permissions:
      contents: read
      packages: write
    name: cargo.build (darwin-arm64)
    runs-on: namespace-profile-cuenv-macos-arm64
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Setup Namespace Nix Cache
      if: runner.os == 'Linux'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Namespace Nix Cache
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi\nif [ \"$(uname -s)\" = Linux ] && [ ! -e /run/systemd/system ] && [ -d /nix ] && [ ! -w /nix ]; then\n\tsudo chown -R \"$(id -u):$(id -g)\" /nix\nfi"
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
        install_url: https://releases.nixos.org/nix/nix-2.31.2/install
    - name: Prune legacy Nix receipt
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi"
    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        installCommand: nix profile install --option flake-registry '' --inputs-from . nixpkgs#cachix
        name: cuenv
    - name: cargo.build (darwin-arm64)
      run: nix develop --accept-flake-config --no-write-lock-file --file .github/release-tools.nix --command bash .github/scripts/release-build.sh
      working-directory: .
      env:
        CUENV_ARCH: darwin-arm64
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cargo-build-darwin-arm64
        path: target/release/cuenv
        if-no-files-found: ignore
        include-hidden-files: true
