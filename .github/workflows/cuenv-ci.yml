# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: cuenv-ci
on:
  push:
    branches:
    - main
    paths:
    - .agents/skills/**
    - .cargo/**
    - .config/**
    - .github/workflows/cuenv-ci.yml
    - Cargo.lock
    - Cargo.lock/**
    - Cargo.toml
    - Cargo.toml/**
    - _tests/**
    - clippy.toml
    - clippy.toml/**
    - contrib/**
    - crates/**
    - cue.mod/**
    - deny.toml
    - deny.toml/**
    - env.cue
    - env.cue/**
    - examples/**
    - flake.lock
    - flake.lock/**
    - flake.nix
    - flake.nix/**
    - llms.txt
    - llms.txt/**
    - schema/**
  pull_request:
    branches:
    - main
    paths:
    - .agents/skills/**
    - .cargo/**
    - .config/**
    - .github/workflows/cuenv-ci.yml
    - Cargo.lock
    - Cargo.lock/**
    - Cargo.toml
    - Cargo.toml/**
    - _tests/**
    - clippy.toml
    - clippy.toml/**
    - contrib/**
    - crates/**
    - cue.mod/**
    - deny.toml
    - deny.toml/**
    - env.cue
    - env.cue/**
    - examples/**
    - flake.lock
    - flake.lock/**
    - flake.nix
    - flake.nix/**
    - llms.txt
    - llms.txt/**
    - schema/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write
jobs:
  build-cuenv:
    name: build.cuenv
    runs-on: namespace-profile-cuenv-macos-arm64
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Setup Namespace Nix Cache
      if: runner.os == 'Linux'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Namespace Nix Cache
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi"
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Prune Determinate Nix receipt
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi"
    - name: Setup Hestia Nix Cache
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025
      with:
        drain-timeout: '900'
        upstream-cache-filter: 'true'
        version: v2.0.0
    - name: Build cuenv (nix)
      run: |-
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        nix build .#cuenv -L --accept-flake-config
        echo "$(pwd)/result/bin" >> "$GITHUB_PATH" 2>/dev/null || echo "$(pwd)/result/bin" >> "$BUILDKITE_ENV_FILE" 2>/dev/null || true
        ./result/bin/cuenv sync ci
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload cuenv
      uses: actions/upload-artifact@v4
      with:
        name: cuenv-bootstrap-namespace-profile-cuenv-macos-arm64
        path: result/bin/cuenv
        if-no-files-found: error
