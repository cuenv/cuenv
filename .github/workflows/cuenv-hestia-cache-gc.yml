name: Hestia Cache GC
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
  schedule:
  - cron: 23 3 * * *
concurrency:
  group: hestia-gc
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  gc:
    name: Hestia Cache GC
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    timeout-minutes: 30
    steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Install Hestia
      uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
      with:
        version: v2.0.0
    - name: Run garbage collection
      run: |-
        "$HESTIA_BIN" gc \
          ${{ inputs.dry-run && '--dry-run' || '' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
