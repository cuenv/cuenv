    - name: Prune legacy Nix receipt
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi"
    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        installCommand: nix profile install --option flake-registry '' --inputs-from . nixpkgs#cachix
        name: cuenv
    - name: Add cuenv to PATH
      run: |-
        set -euo pipefail
        if ! command -v nix >/dev/null; then
        if [ -f /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        else
        . "$HOME/.nix-profile/etc/profile.d/nix.sh"
        fi
        fi
        cuenv_package="$(nix build .#cuenv --no-link --print-out-paths -L --accept-flake-config)"
        echo "$cuenv_package/bin" >> "$GITHUB_PATH"
    - name: Setup 1Password
      run: cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: docs.build
      run: cuenv task docs.build -e production --skip-dependencies
      working-directory: .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docs-build-artifacts
        path: docs/dist
        if-no-files-found: ignore
        include-hidden-files: true
