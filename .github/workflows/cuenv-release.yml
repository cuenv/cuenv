# One-off recovery for the already-published 0.70.0 release.
# Publish already-verified binaries from run 42313030213; no binary rebuilds.

name: cuenv-release-publish-recovery
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release to recover
        required: true
        type: choice
        options:
        - '0.70.0'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish-github:
    permissions:
      actions: read
      contents: write
      packages: write
    name: publish.github
    runs-on: namespace-profile-cuenv-linux-x86
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: 0.70.0
    - name: Verify immutable release source
      run: test "$(git rev-parse HEAD)" = c02cd755b4cbc3257a5b7a44121bb27e25b179cb
    - name: Setup Namespace Nix Cache
      if: runner.os == 'Linux'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Namespace Nix Cache
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi\nif [ \"$(uname -s)\" = Linux ] && [ ! -e /run/systemd/system ] && [ -d /nix ] && [ ! -w /nix ]; then\n\tsudo chown -R \"$(id -u):$(id -g)\" /nix\nfi"
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
        install_url: https://releases.nixos.org/nix/nix-2.31.2/install
    - name: Prune legacy Nix receipt
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi"
    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        installCommand: nix profile install --option flake-registry '' --inputs-from . nixpkgs#cachix
        name: cuenv
    - name: Add cuenv to PATH
      run: |-
        set -euo pipefail
        if ! command -v nix >/dev/null; then
        if [ -f /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        else
        . "$HOME/.nix-profile/etc/profile.d/nix.sh"
        fi
        fi
        cuenv_package="$(nix build .#cuenv --no-link --print-out-paths -L --accept-flake-config)"
        "$cuenv_package/bin/cuenv" --version | grep -Fx 'cuenv 0.70.0'
        echo "$cuenv_package/bin" >> "$GITHUB_PATH"
    - name: Setup 1Password
      run: cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Download cargo-build-darwin-arm64
      uses: actions/download-artifact@v4
      with:
        name: cargo-build-darwin-arm64
        path: dist/darwin-arm64
        run-id: 42313030213
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Download cargo-build-linux-arm64
      uses: actions/download-artifact@v4
      with:
        name: cargo-build-linux-arm64
        path: dist/linux-arm64
        run-id: 42313030213
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Download cargo-build-linux-x64
      uses: actions/download-artifact@v4
      with:
        name: cargo-build-linux-x64
        path: dist/linux-x64
        run-id: 42313030213
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: publish.github
      run: GITHUB_REF_NAME=0.70.0 GITHUB_REF_TYPE=tag cuenv task publish.github -e production --skip-dependencies
      working-directory: .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        PATHS: dist/**/*
        TAG: 0.70.0
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  publish-homebrew:
    permissions:
      contents: read
    name: publish.homebrew
    runs-on: namespace-profile-cuenv-linux-x86
    needs:
    - publish-github
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
        ref: 0.70.0
    - name: Verify immutable release source
      run: test "$(git rev-parse HEAD)" = c02cd755b4cbc3257a5b7a44121bb27e25b179cb
    - name: Setup Namespace Nix Cache
      if: runner.os == 'Linux'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Namespace Nix Cache
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi\nif [ \"$(uname -s)\" = Linux ] && [ ! -e /run/systemd/system ] && [ -d /nix ] && [ ! -w /nix ]; then\n\tsudo chown -R \"$(id -u):$(id -g)\" /nix\nfi"
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: accept-flake-config = true
        install_url: https://releases.nixos.org/nix/nix-2.31.2/install
    - name: Prune legacy Nix receipt
      run: "if [ -e /nix/receipt.json ]; then\n\tif command -v sudo >/dev/null 2>&1; then\n\t\tsudo rm -f /nix/receipt.json\n\telse\n\t\trm -f /nix/receipt.json\n\tfi\nfi"
    - name: Setup Cachix
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        installCommand: nix profile install --option flake-registry '' --inputs-from . nixpkgs#cachix
        name: cuenv
    - name: Add cuenv to PATH
      run: |-
        set -euo pipefail
        if ! command -v nix >/dev/null; then
        if [ -f /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        else
        . "$HOME/.nix-profile/etc/profile.d/nix.sh"
        fi
        fi
        cuenv_package="$(nix build .#cuenv --no-link --print-out-paths -L --accept-flake-config)"
        "$cuenv_package/bin/cuenv" --version | grep -Fx 'cuenv 0.70.0'
        echo "$cuenv_package/bin" >> "$GITHUB_PATH"
    - name: Setup 1Password
      run: cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: publish.homebrew
      run: GITHUB_REF_NAME=0.70.0 GITHUB_REF_TYPE=tag cuenv task publish.homebrew -e production --skip-dependencies
      working-directory: .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        TAG: 0.70.0
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
