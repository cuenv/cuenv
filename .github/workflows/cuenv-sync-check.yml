concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write
jobs:
  cuenv-sync-check:
    name: cuenv-sync-check
    runs-on: namespace-profile-cuenv-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Setup Hestia Nix Cache
      uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527
      with:
        drain-timeout: '900'
        upstream-cache-filter: 'true'
        version: v2.0.0
    - name: Build cuenv (nix)
      run: |-
        . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
        nix build .#cuenv -L --accept-flake-config
        echo "$(pwd)/result/bin" >> "$GITHUB_PATH" 2>/dev/null || echo "$(pwd)/result/bin" >> "$BUILDKITE_ENV_FILE" 2>/dev/null || true
        ./result/bin/cuenv sync ci
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 'Run pipeline: sync-check'
      run: cuenv ci --pipeline sync-check --path .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
