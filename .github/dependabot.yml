version: 2
# Dependabot rebases a pull request whenever it conflicts with main. Release
# commits change every workspace version in Cargo.lock, so open Cargo updates
# conflicted on each release and rebased the moment the release started, and
# their CI took the x86 runners the release binaries were waiting for. Comment
# `@dependabot rebase` on a pull request to update it.
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    reviewers:
      - "rawkode"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Ignore patch updates for stable dependencies
      - dependency-name: "serde*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "tokio*"
        update-types: ["version-update:semver-patch"]

  # Go dependencies for cuengine bridge
  - package-ecosystem: "gomod"
    directories:
      - "/crates/cuengine"
      - "/crates/infrastructure/tests/fake_provider"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    reviewers:
      - "rawkode"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    reviewers:
      - "rawkode"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
