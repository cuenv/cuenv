[package]
name = "cuenv-task-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Task execution engine for the cuenv ecosystem"

[dependencies]
cuenv-core = { workspace = true }
cuenv-manifest = { workspace = true }
cuenv-task-graph = { workspace = true }
cuenv-cas = { workspace = true }
cuenv-vcs = { workspace = true }
cuenv-events = { workspace = true }
cuenv-workspaces = { workspace = true, features = ["detection"] }

tokio = { workspace = true }
tracing = { workspace = true }
async-recursion = "1.1"
petgraph = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
globset = { workspace = true }
walkdir = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
sysinfo = "0.37"

[dev-dependencies]
bazel-remote-apis = { workspace = true }
prost = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }

[lints]
workspace = true
