[package]
name = "cuenv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cuenv-cli"
keywords.workspace = true
categories = ["command-line-utilities", "config", "development-tools"]
readme = "../../readme.md"
description = "Event-driven CLI with inline TUI for cuenv"

[lib]
name = "cuenv"
path = "src/lib.rs"

[[bin]]
name = "cuenv"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = [
    "dagger-backend",
    "github",
    "gitlab",
    "bitbucket",
    "buildkite",
    "homebrew",
    "1password",
    "infisical",
    "aws",
    "gcp",
]
dagger-backend = ["dep:cuenv-dagger"]
# Platform-specific providers
github = ["dep:cuenv-github"]
gitlab = ["dep:cuenv-gitlab"]
bitbucket = ["dep:cuenv-bitbucket"]
buildkite = ["dep:cuenv-buildkite"]
homebrew = ["dep:cuenv-homebrew"]
# Secret providers, registered at the composition root (RFC-0006 phase 3b)
1password = ["dep:cuenv-1password"]
infisical = ["dep:cuenv-infisical"]
aws = ["dep:cuenv-aws"]
gcp = ["dep:cuenv-gcp"]
# Enable all platforms
all-platforms = ["github", "gitlab", "bitbucket", "buildkite", "homebrew"]

[[test]]
name = "bdd"
harness = false

[dependencies]
cuenv-cas = { workspace = true }
cuenv-vcs = { workspace = true }
cuenv-codeowners = { workspace = true }
cuenv-core = { workspace = true }
cuenv-secrets = { workspace = true }
cuenv-1password = { workspace = true, optional = true }
cuenv-infisical = { workspace = true, optional = true }
cuenv-aws = { workspace = true, optional = true }
cuenv-gcp = { workspace = true, optional = true }
cuenv-hooks = { workspace = true }
cuenv-workspaces = { workspace = true, features = [
    "detection",
    "discovery-javascript",
    "discovery-rust",
] }
cuenv-codegen = { workspace = true }
cuenv-dagger = { workspace = true, optional = true }
cuenv-ci = { workspace = true }
cuenv-editorconfig = { workspace = true }
cuenv-events = { workspace = true }
cuenv-ignore = { workspace = true }
cuenv-release = { workspace = true }
cuenv-services = { workspace = true }
cuengine = { workspace = true }
gix = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
# Platform-specific providers (optional)
cuenv-github = { workspace = true, optional = true }
cuenv-gitlab = { workspace = true, optional = true }
cuenv-bitbucket = { workspace = true, optional = true }
cuenv-buildkite = { workspace = true, optional = true }
cuenv-homebrew = { workspace = true, optional = true }
# Tool providers (multi-source tool management)
cuenv-tools-oci = { workspace = true }
cuenv-tools-github = { workspace = true }
cuenv-tools-nix = { workspace = true }
cuenv-tools-rustup = { workspace = true }
cuenv-tools-url = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rayon = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
semver = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
miette = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }
ctrlc = "3.5"
similar = "2.7"
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring"] }
tempfile = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
tokio-test = { workspace = true }
sha2 = { workspace = true }
assert_cmd = "2.2.2"
predicates = "3.1.4"
which = "8.0.2"
cuenv-task-graph = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
