[package]
name = "cuenv-tools-github"
version.workspace = true
edition = "2024"
rust-version = "1.85.0"
description = "GitHub Releases tool provider for cuenv"
license = "MIT"
repository = "https://github.com/cuenv/cuenv"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = { workspace = true }
cuenv-core = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
# xz2 prefers system liblzma via pkg-config and falls back to a bundled C build,
# mirroring the linking posture of flate2 elsewhere in the workspace.
xz2 = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
temp-env = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
