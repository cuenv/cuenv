[profile.default]
# Test timeout for individual tests
slow-timeout = "60s"
# Leak timeout for tests that might leak processes
leak-timeout = "100ms"

# Retry failed tests up to 3 times
retries = 3

# Configure test output
status-level = "fail"
failure-output = "final"
success-output = "never"

# Parallel test execution
test-threads = "num-cpus"

[profile.ci]
# More strict settings for CI
slow-timeout = "30s"
retries = 1
status-level = "all"
failure-output = "immediate-final"

[profile.bdd]
# BDD-specific profile for integration tests
slow-timeout = "120s"
retries = 1
test-threads = 1
status-level = "all"
failure-output = "immediate-final"

# Filter patterns for different test types
[[profile.default.overrides]]
filter = 'test(/^integration_/)'
slow-timeout = "120s"

# These tests share one sqld. Under heavy write contention sqld 0.24 can keep the
# write slot of a connection that failed to start its transaction and has since
# closed, and every later writer then waits forever. Fewer writers avoid it in
# practice, and the timeout turns it into a failure rather than a stuck check.
[[profile.default.overrides]]
filter = 'binary(provider_end_to_end) | binary(infrastructure_lifecycle)'
test-group = "shared-sqld"
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
bdd = { max-threads = 1 }
integration = { max-threads = 2 }
shared-sqld = { max-threads = 8 }

[profile.default.junit]
path = "target/nextest/junit.xml"