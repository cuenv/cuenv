[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024", "--config", "imports_granularity=Module,hex_literal_case=Lower,format_macro_matchers=true"]
includes = ["*.rs"]

[formatter.gofmt]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.yml", "*.yaml", "*.md"]
excludes = ["Cargo.lock", "*.toml"]
